name: Build iOS 6 App with Theos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install Legacy iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o $HOME/sdk.zip https://github.com/xybp88/iOS-SDKs/archive/refs/heads/master.zip
          unzip -q $HOME/sdk.zip -d $HOME/sdk-extracted
          cp -r $HOME/sdk-extracted/iOS-SDKs-master/iPhoneOS6.1.sdk $HOME/theos/sdks/ || cp -r $HOME/sdk-extracted/iOS-SDKs-master/iPhoneOS7.1.sdk $HOME/theos/sdks/

      - name: Build Package
        run: |
          make FINALPACKAGE=1
