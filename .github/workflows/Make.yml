name: Build iOS 6 App with Theos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos Environment
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Download Legacy iOS 6.1 SDK
        run: |
          # Klonen des Legacy-SDK-Repos (nur die Historie weglassen für einen schnellen Download)
          git clone --depth 1 https://github.com/EachAndOther/Legacy-iOS-SDKs.git $HOME/legacy-sdks
          
          # Sicherstellen, dass der Theos-SDK-Ordner existiert
          mkdir -p $HOME/theos/sdks
          
          # Das iPhoneOS6.1.sdk direkt in den theos/sdks Ordner kopieren
          cp -r $HOME/legacy-sdks/iPhoneOS6.1.sdk $HOME/theos/sdks/

      - name: Build Package
        run: |
          make FINALPACKAGE=1
